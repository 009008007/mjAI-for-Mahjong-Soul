[package]
name = "majsoul-bridge-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1"
bytes = "1.9"
futures-util = { version = "0.3", features = ["sink"] }
prost = "=0.13.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "time", "signal", "sync"] }
tokio-tungstenite = "=0.26.2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
libriichi = { path = "../Mortal/libriichi", default-features = false }

[build-dependencies]
prost-build = "=0.13.5"
protoc-bin-vendored = "=3.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
